openapi: 3.0.3
info:
  title: SDET Retail Automation Lab API
  version: 0.1.0
servers:
  - url: http://localhost:4000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status
  /api/debug/cart-total:
    get:
      summary: Delayed cart total for Day 5 debugging labs
      parameters:
        - in: query
          name: delay
          schema:
            type: integer
          description: Artificial response delay in milliseconds, capped by the service.
      responses:
        "200":
          description: Debug cart total summary
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login succeeded
        "401":
          description: Invalid credentials
        "423":
          description: Account locked
  /api/products:
    get:
      summary: List products
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Product list
  /api/products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
        "404":
          description: Product not found
  /api/legacy/products/{id}.xml:
    get:
      summary: Legacy XML product detail for Week 2 Day 2 XmlPath labs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail as XML
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: Product not found as XML
  /api/cart/items:
    post:
      summary: Add cart item
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Existing matching cart item quantity updated
        "201":
          description: Cart item added
        "400":
          description: Invalid quantity
        "409":
          description: Stock or quantity limit conflict
  /api/cart/items/{id}:
    put:
      summary: Update cart item quantity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cart item updated
        "400":
          description: Invalid quantity
        "404":
          description: Cart item not found
        "409":
          description: Stock or quantity limit conflict
    delete:
      summary: Delete cart item
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cart item deleted
        "404":
          description: Cart item not found
  /api/cart:
    get:
      summary: Get cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart state
    delete:
      summary: Clear cart
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cart cleared
  /api/orders:
    get:
      summary: List orders for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's orders
    post:
      summary: Create order
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Order created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created order
        "400":
          description: Empty cart or invalid totals
  /api/orders/{id}:
    get:
      summary: Get order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
  /api/admin/orders:
    get:
      summary: List orders for admin review
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin order list
  /api/oauth/token:
    post:
      summary: Create an OAuth-style access token for Week 2 authentication labs
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  example: client_credentials
                client_id:
                  type: string
                  example: retail-test-client
                client_secret:
                  type: string
                  format: password
      responses:
        "200":
          description: Access token created
        "400":
          description: Unsupported grant type
        "401":
          description: Invalid client credentials
  /api/secure/orders:
    post:
      summary: Create an order using an OAuth access token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, total]
              properties:
                items:
                  type: array
                  items:
                    type: object
                total:
                  type: number
                  format: double
                userId:
                  type: integer
      responses:
        "201":
          description: Order created and persisted
        "401":
          description: Missing or invalid access token
        "403":
          description: Token does not contain the required scope
  /api/secure/orders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get a secure order by ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order detail
        "401":
          description: Missing or invalid access token
        "404":
          description: Order not found
    delete:
      summary: Delete a secure order after a database validation test
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Order deleted
        "401":
          description: Missing or invalid access token
        "404":
          description: Order not found
  /api/secure/orders/{id}/allocate:
    post:
      summary: Allocate a created order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order moved from CREATED to ALLOCATED
        "401":
          description: Missing or invalid access token
        "403":
          description: Token does not have the OPS role or write scope
        "404":
          description: Order not found
        "409":
          description: Order is not in CREATED state
  /api/secure/orders/{id}/ship:
    post:
      summary: Ship an allocated order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order moved from ALLOCATED to SHIPPED
        "401":
          description: Missing or invalid access token
        "403":
          description: Token does not have the OPS role or write scope
        "404":
          description: Order not found
        "409":
          description: Order is not in ALLOCATED state
  /api/partner/orders/{id}:
    get:
      summary: Get an order using a partner API key
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partner order detail
        "401":
          description: Missing API key
        "403":
          description: Invalid API key
        "404":
          description: Order not found
  /api/sales:
    get:
      summary: List synced POS sales for the current user/session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: POS sales list
    post:
      summary: Sync a queued POS sale idempotently
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Stable client sale id used to prevent duplicate sale effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSaleId, productId, quantity]
              properties:
                clientSaleId:
                  type: string
                  example: sale-2026-001
                productId:
                  type: integer
                  example: 101
                productName:
                  type: string
                  example: Running Shoes
                quantity:
                  type: integer
                  example: 1
                total:
                  type: integer
                  description: Sale total in rupees for the POS offline lab UI.
                  example: 4499
                cashier:
                  type: string
                  example: customer@example.com
      responses:
        "201":
          description: Sale synced
        "200":
          description: Duplicate idempotency key replayed the existing sale
        "400":
          description: Missing clientSaleId or invalid quantity
        "404":
          description: Product not found
  /api/refund-lab/orders:
    post:
      summary: Seed a refund lab order for Week 5 Day 5
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Refund-Session
          schema:
            type: string
          description: Optional classroom session key used to isolate refund lab data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                daysAgo:
                  type: integer
                  example: 5
                taxPaise:
                  type: integer
                  example: 4995
                paymentMethod:
                  type: string
                  example: Original card
                lines:
                  type: array
                  items:
                    type: object
                    required: [sku, unitPaise, qty]
                    properties:
                      sku:
                        type: string
                        example: TEE
                      name:
                        type: string
                        example: Training Tee
                      unitPaise:
                        type: integer
                        example: 33300
                      qty:
                        type: integer
                        example: 3
                      finalSale:
                        type: boolean
                      nonReturnable:
                        type: boolean
      responses:
        "201":
          description: Refund lab order created
  /api/refund-lab/orders/{id}:
    get:
      summary: Read a refund lab order and its ledger state
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: header
          name: X-Refund-Session
          schema:
            type: string
      responses:
        "200":
          description: Refund lab order with refundCount, refundableBalancePaise, and lastRefund
        "404":
          description: Refund lab order not found
  /api/refunds/check:
    post:
      summary: Check refund eligibility without moving money
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, lines]
              properties:
                orderId:
                  type: integer
                  example: 7001
                lines:
                  oneOf:
                    - type: string
                      enum: [ALL]
                    - type: array
                      items:
                        type: object
                        properties:
                          sku:
                            type: string
                          qty:
                            type: integer
      responses:
        "200":
          description: Eligibility verdict such as APPROVED, OUT_OF_WINDOW, FINAL_SALE, NON_RETURNABLE, OVER_REFUND, or ALREADY_REFUNDED
  /api/refunds:
    post:
      summary: Create a full or partial refund idempotently
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Stable refund key used to replay the same refund instead of double-paying.
        - in: header
          name: X-Refund-Session
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, lines]
              properties:
                orderId:
                  type: integer
                  example: 7001
                lines:
                  oneOf:
                    - type: string
                      enum: [ALL]
                    - type: array
                      items:
                        type: object
                        properties:
                          sku:
                            type: string
                            example: TEE
                          qty:
                            type: integer
                            example: 1
      responses:
        "201":
          description: Refund created with amountPaise, lineAmountPaise, taxPaise, taxShares, refundCount, and refundableBalancePaise
        "200":
          description: Idempotency-Key replayed an existing refund
        "404":
          description: Refund lab order not found
        "422":
          description: Refund rejected with a stable reason code
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
